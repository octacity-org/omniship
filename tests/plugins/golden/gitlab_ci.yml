# Generated by OmniShip from workflow.py. Do not edit directly.
workflow:
  rules:
  - if: $CI_COMMIT_TAG
    variables:
      OMNISHIP_REF_TYPE: tag
  - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    variables:
      OMNISHIP_REF_TYPE: branch
  - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"
    when: never
  - if: $CI_COMMIT_BRANCH
    variables:
      OMNISHIP_REF_TYPE: branch
stages:
- check
- build
- ship
default:
  image: ghcr.io/astral-sh/uv:0.13.8-python3.14-trixie-slim
variables:
  UV_LINK_MODE: copy
  OMNISHIP_REF_NAME: $CI_COMMIT_REF_NAME
check-lint:
  stage: check
  script:
  - uvx --from omniship==9.9.9 omniship run-node --stage check --node lint --config omniship.yaml
check-test:
  stage: check
  image: ghcr.io/astral-sh/uv:0.13.8-python3.14-trixie
  tags:
  - linux
  - large
  timeout: 20m
  needs:
  - check-lint
  variables:
    LOG_LEVEL: debug
    PRICE:
      value: 5$
      expand: false
    TOKEN: $PYPI_TOKEN
  script:
  - uvx --from omniship==9.9.9 omniship run-node --stage check --node test --config omniship.yaml
check-types:
  stage: check
  script:
  - uvx --from omniship==9.9.9 omniship run-node --stage check --node types --config omniship.yaml
check-complete:
  stage: check
  needs:
  - check-test
  - check-types
  script:
  - echo 'check stage complete'
build-package:
  stage: build
  needs:
  - check-complete
  variables:
    OMNISHIP_REVISION: $CI_COMMIT_SHA
  script:
  - uvx --from omniship==9.9.9 omniship run-node --stage build --node package --config omniship.yaml
build-docs:
  stage: build
  needs:
  - build-package
  variables:
    OMNISHIP_REVISION: $CI_COMMIT_SHA
  script:
  - uvx --from omniship==9.9.9 omniship run-node --stage build --node docs --config omniship.yaml
build-complete:
  stage: build
  needs:
  - build-docs
  script:
  - echo 'build stage complete'
